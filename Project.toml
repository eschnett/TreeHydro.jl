name = "TreeHydro"
uuid = "18f621c7-d3c4-4697-8f68-54143cdddff7"
version = "0.1.0"
authors = ["Erik Schnetter <schnetter@gmail.com>"]

[deps]
IMEXRungeKutta = "6f46d5f7-e15e-41aa-a098-eed9d1a63ad8"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
TreeAMR = "91bc416d-811c-44c1-9bc4-b9c8bbdbbd08"

# IMEXRungeKutta is not in the General registry, so a clean clone finds it
# here; TreeAMR is (0.1.3 carries the owner-based threading this package
# is written against) and needs no entry. `[sources]` is a 1.11 feature,
# which the Julia floor below already is.
[sources]
IMEXRungeKutta = {rev = "main", url = "https://github.com/eschnett/IMEXRungeKutta.jl"}

[compat]
IMEXRungeKutta = "1.2"
KernelAbstractions = "0.9.42, 1"
TreeAMR = "0.1.3"
julia = "1.11"
