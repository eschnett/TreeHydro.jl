name = "TreeHydro"
uuid = "18f621c7-d3c4-4697-8f68-54143cdddff7"
version = "0.1.0"
authors = ["Erik Schnetter <schnetter@gmail.com>"]

[deps]
IMEXRungeKutta = "6f46d5f7-e15e-41aa-a098-eed9d1a63ad8"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
TreeAMR = "91bc416d-811c-44c1-9bc4-b9c8bbdbbd08"
TreeIOHDF5 = "49af10b2-b28a-4989-bafa-527ac30d3246"

# IMEXRungeKutta and TreeIOHDF5 are not in the General registry, so a clean
# clone finds them here (IMEXRungeKutta 1.3 is the first to run `Float32x2`,
# which step 12 tests; TreeIOHDF5 holds the checkpoint functions TreeAMR 0.2
# moved out of its HDF5 extension). TreeAMR is registered (0.2 is the
# release without the checkpoints, which are TreeIOHDF5's since) and needs
# no entry. `[sources]` is a 1.11 feature, which the Julia floor below
# already is.
[sources]
IMEXRungeKutta = {rev = "main", url = "https://github.com/eschnett/IMEXRungeKutta.jl"}
TreeIOHDF5 = {rev = "main", url = "https://github.com/eschnett/TreeIOHDF5.jl"}

[compat]
IMEXRungeKutta = "1.3"
KernelAbstractions = "0.9.42, 1"
TreeAMR = "0.2"
TreeIOHDF5 = "0.1.0"
julia = "1.11"
