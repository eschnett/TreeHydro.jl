name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    # A guard against a runtime regression, not a guess at the runtime.
    # The whole suite is expected to take a few minutes per entry: the
    # tests themselves are under two minutes locally at either thread
    # count, a shared runner is a few times slower than that, and the rest
    # is precompilation. So 30 minutes is far above anything a healthy run
    # reaches and far below an hour of somebody's billed minutes, and a
    # change that makes the suite ten times slower fails here instead of
    # quietly costing that.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.11 is the floor: TreeAMR is unregistered, so Project.toml
        # locates it through a `[sources]` entry, which 1.11 introduced.
        version: ["1.11", "1"]
        os: [ubuntu-latest, macOS-latest]
        include:
          - version: "1"
            os: ubuntu-latest
            threads: 4
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Coverage exactly on the single-threaded cells, and the
          # exclusion is the single most important thing in this file.
          # Julia compiles a coverage hit into an atomic
          # read-modify-write on one global counter per source line, and
          # the counters of 32 neighbouring lines share a 256-byte block,
          # so every thread running the same kernel contends on the same
          # cache line. Measured locally on the D = 2 entropy-wave sweep:
          # 1.83 s at one thread and 0.79 s at four without coverage,
          # 10.35 s and 79.13 s with it -- 5.7x at one thread, 100x at
          # four, and the sign of threading inverted. On this matrix,
          # with coverage on everywhere, it turned a 5-minute serial job
          # into a 53-minute threaded one. The serial cells pay the 5.7x
          # and run the same lines the threaded one does, so instrumenting
          # them alone loses no coverage and leaves the expensive job
          # alone.
          coverage: ${{ (matrix.threads || 1) == 1 }}
        env:
          # The suite must pass, with identical numbers, threaded as well
          # as serial. One entry of the matrix is enough to guard that:
          # the thread-independence test spawns a subprocess at the
          # *other* count either way, so between this job and the serial
          # ones both directions are covered. (That test arrives in step
          # 13; the entry is here from the start so that the threaded path
          # is exercised while it is being written.) Every number the suite
          # prints must be identical at both counts, which is TreeAMR's
          # invariant restated for this package.
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ (matrix.threads || 1) == 1 }}
      - uses: codecov/codecov-action@v5
        if: ${{ (matrix.threads || 1) == 1 }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false

  # There is deliberately no viewer job yet. TreeWave has one because
  # `bin/` is a second environment with its own copy of the TreeAMR
  # dependency, which the test job cannot exercise -- during its
  # development that let `bin/` keep building against an older TreeAMR
  # than the tests. This package has no `bin/` until step 11, and the job
  # is added with it.
