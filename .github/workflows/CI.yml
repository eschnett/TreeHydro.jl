name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
    # A Markdown-only change cannot move a measured number.
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    # A guard against a runtime regression, not a budget: every healthy
    # cell here runs in ten to thirteen minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One cell per axis, spelled out rather than a `version x os`
      # product: the floor version, the current release, macOS/arm64, and
      # threads. The floor on Linux is the redundant fourth pair.
      matrix:
        include:
          # Julia 1.11 is the floor, shared by all the Tree* packages
          # since 2026-09-25 so that an unregistered dependency can be
          # located with `[sources]`, a 1.11 key. (It was 1.10, TreeAMR's
          # floor then, between TreeAMR's registration and that date.)
          # It is stricter than 1.13: it still refuses to redefine a
          # `const`, which is the thing the floor cell has actually caught.
          #
          # It also carries the coverage, because instrumented it is the
          # fastest cell of the four: measured locally, back to back,
          # coverage costs 1.04x on 1.11 against 3.14x on 1.13 (8 m 55 ->
          # 9 m 17 against 4 m 01 -> 12 m 38, at 11609 tests; at 1.10 it
          # was 1.83x, and the ordering held there too). No file in `src/`
          # or `test/` has a `VERSION` check, so the lines reported are the
          # same whichever cell reports them.
          - version: "1.11"
            os: macOS-latest
            coverage: true
          - version: "1"
            os: ubuntu-latest
          # arm64 on the current release: Base's `@simd` reductions
          # arrange their partial sums by CPU target, which "Testing" in
          # `CODE.md` rests on.
          - version: "1"
            os: macOS-latest
          # Threaded. Never instrument this one: a coverage hit is an
          # atomic increment on one counter per line, so threads running
          # the same kernel contend on one cache line -- 100x.
          - version: "1"
            os: ubuntu-latest
            threads: 4
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # One cell, and only where the badge reads it. The dispatch arm
          # keeps the upload path exercisable from a branch.
          coverage: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
          # Explicit because the package now depends on it. The three RHS
          # kernels carry `@inbounds`, which makes their index arithmetic an
          # assertion rather than a check; this is the only thing that
          # falsifies it, since `--check-bounds=yes` overrides `@inbounds`
          # package-wide and re-checks every index they form. It is already
          # this action's default, so it changes nothing today -- the point
          # is that a default which silently changed would turn an unchecked
          # `@inbounds` into memory corruption rather than a test failure.
          # See "Bounds checking in the kernels" in `CODE.md`; TreeAMR's
          # CI.yml carries the same line for the same reason.
          check_bounds: 'yes'
        env:
          # Every number the suite prints must be identical at one thread
          # and at four.
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
      - uses: codecov/codecov-action@v5
        if: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false

  # `bin/` has its own environment, so the test job above cannot exercise
  # it: the viewers can keep building against a different TreeAMR from the
  # tests -- they no longer carry a second pin, but they do resolve
  # separately -- until they fail on an API the tests are already using,
  # which is exactly how TreeWave's `bin/` broke on the removed
  # `cell_center`. Nothing in `src/` or `test/` would notice.
  # This job runs them for real and keeps the figures, so a plot that
  # silently stops making sense is visible rather than merely unbroken.
  #
  # Ungated, unlike the coverage step: coverage is a report whose consumer
  # only reads `main`, while this is a check, and a pull request is exactly
  # where a broken viewer should be caught. It runs beside the four test
  # cells rather than after them, so it is not on the critical path.
  viewer:
    name: Viewer (bin/)
    runs-on: ubuntu-latest
    # As on the test job: a guard against a runtime regression, not a
    # budget. Measured cold on the first run, 11 m 43 -- of which 7 m 31 is
    # instantiating CairoMakie and 3 m 50 the four renders -- so 30 leaves
    # 2.5x of headroom over a cold draw, and a warm one skips most of the
    # precompilation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      # The default cache key carries the job name, so this environment --
      # which is CairoMakie and a second TreeAMR checkout, and the test
      # matrix's is neither -- gets its own entry without being told to.
      - uses: julia-actions/cache@v3
      - name: Instantiate the viewer environment
        run: julia --project=bin -e 'using Pkg; Pkg.instantiate()'
      - name: Render the tracked shock tube
        run: julia --project=bin bin/visualize1d.jl --no-display
      # The reduced-precision path has its own conversions -- at the plotting
      # boundary, and in the host `Float64` exact Riemann solution -- and none
      # of them are exercised by the default render. The tube is the cheap
      # case to do it on.
      - name: Render the shock tube at Float32
        run: julia --project=bin bin/visualize1d.jl --type=f32 --no-display
      - name: Render the Kelvin-Helmholtz filmstrip and diagnostics
        run: julia --project=bin bin/visualize2d.jl --case=kh --no-display
      # `--movie` rides on the Sedov step rather than the Kelvin-Helmholtz
      # one for two reasons: Sedov is the cheaper 2D case, having no uniform
      # reference run beside it, and leaving the KH step alone keeps the
      # default no-movie path exercised as well. Twelve frames is a smoke
      # test and not a film -- it costs about five seconds and its only job
      # is that `bin/` cannot grow a broken `--movie` unnoticed, which is
      # this whole job's reason for existing.
      - name: Render the Sedov filmstrip, radial scatter and a short movie
        run: |
          julia --project=bin bin/visualize2d.jl --case=sedov --movie \
            --movie-frames=12 --no-display
      # Four separate processes on purpose, and not one `julia -e` that
      # includes both scripts: each defines `main`, `snapshot`/`frame2d` and
      # `const LEVELCOLORS` at top level in `Main`, and Julia 1.10 and 1.11
      # -- the package's floor, and this environment's -- refuse to redefine
      # a `const`.
      - name: Check that every figure was written
        run: |
          test -s bin/output/sod_1d.png
          test -s bin/output/sod_1d_f32.png
          test -s bin/output/kh_2d.png
          test -s bin/output/sedov_2d.png
          test -s bin/output/sedov_2d.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          # Everything the viewers wrote, not `*.png`: the glob used to be
          # extension-specific, which would have produced the movie above
          # and then silently dropped it from the artifact.
          path: bin/output/*
