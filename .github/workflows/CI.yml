name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
    # A Markdown-only change cannot move a measured number.
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    # A guard against a runtime regression, not a budget: every healthy
    # cell here runs in ten to thirteen minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One cell per axis, spelled out rather than a `version x os`
      # product: the floor version, the current release, macOS/arm64, and
      # threads. The floor on Linux is the redundant fourth pair.
      matrix:
        include:
          # Julia 1.11 is what `[sources]` requires, and it is stricter
          # than 1.13 -- it still refuses to redefine a `const`.
          #
          # It also carries the coverage, because instrumented this is the
          # fastest cell of the four by a factor of up to 3.4 (coverage
          # costs 1.04x on 1.11 against 3.14x on 1.13, and these runners
          # are faster than the Linux ones). No file in `src/` or `test/`
          # has a `VERSION` check, so the lines reported are the same
          # whichever cell reports them.
          - version: "1.11"
            os: macOS-latest
            coverage: true
          - version: "1"
            os: ubuntu-latest
          # arm64 on the current release: Base's `@simd` reductions
          # arrange their partial sums by CPU target, which "Testing" in
          # `CODE.md` rests on.
          - version: "1"
            os: macOS-latest
          # Threaded. Never instrument this one: a coverage hit is an
          # atomic increment on one counter per line, so threads running
          # the same kernel contend on one cache line -- 100x.
          - version: "1"
            os: ubuntu-latest
            threads: 4
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # One cell, and only where the badge reads it. The dispatch arm
          # keeps the upload path exercisable from a branch.
          coverage: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        env:
          # Every number the suite prints must be identical at one thread
          # and at four.
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
      - uses: codecov/codecov-action@v5
        if: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false
