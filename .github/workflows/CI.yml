name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    # This job runs the short tier only, and the timeout below is a guard
    # and not a guess. Before the tiers existed the suite took 53
    # minutes on the 4-thread entry of this matrix -- all of it in the
    # tests -- against 3 to 6 minutes on each of the four serial entries,
    # and the log's timestamps localize it: the two-dimensional physics
    # sweeps are 10 to 17 times slower under 4 threads on a 4-vCPU shared
    # runner than under 1 thread on the same kind of runner (the D = 2
    # interface-order sweep 1m54 -> 31m05; the D = 2 entropy wave 13 s ->
    # 2m57; p = 1 with the fixup off 34 s -> 9m27; the D = 3 two-level
    # 15 s -> 1m17), while one-dimensional runs cost seconds either way.
    # Locally, on twelve cores, four threads is faster than one. So the
    # sweeps live in the long tier and run in Long.yml at one thread, and
    # the short tier keeps every D >= 2 run at N <= 8 and a few dozen
    # steps. A regression in runtime is then a failure and not an hour of
    # somebody's billed minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.11 is the floor: TreeAMR is unregistered, so Project.toml
        # locates it through a `[sources]` entry, which 1.11 introduced.
        version: ["1.11", "1"]
        os: [ubuntu-latest, macOS-latest]
        include:
          - version: "1"
            os: ubuntu-latest
            threads: 4
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # `julia-runtest` turns coverage on by default and nothing here
          # consumes it -- there is no upload step and no Codecov badge --
          # so it is one more multiplier on the runtime for nothing.
          coverage: false
        env:
          # The suite must pass, with identical numbers, threaded as well
          # as serial. One entry of the matrix is enough to guard that:
          # the thread-independence test spawns a subprocess at the
          # *other* count either way, so between this job and the serial
          # ones both directions are covered. (That test arrives in step
          # 13; the entry is here from the start so that the threaded path
          # is exercised while it is being written.) The stored reference
          # outputs are compared at both counts and must be bit-identical
          # at both, which is TreeAMR's invariant restated as data.
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}

  # There is deliberately no viewer job yet. TreeWave has one because
  # `bin/` is a second environment with its own copy of the TreeAMR
  # dependency, which the test job cannot exercise -- during its
  # development that let `bin/` keep building against an older TreeAMR
  # than the tests. This package has no `bin/` until step 11, and the job
  # is added with it.
