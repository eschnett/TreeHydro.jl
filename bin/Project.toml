# The viewers have their own environment so that CairoMakie -- a heavy
# dependency that nothing in `src/` needs -- never becomes a dependency of
# the package.
#
# There is one `[sources]` entry left, and it is for *this* package, which
# is unregistered; TreeAMR is resolved from the General registry here as it
# is in the package environment, so there is no longer a second TreeAMR pin
# to keep in step with the first. The entry is also why this environment
# still needs Julia 1.11 while the package itself runs at 1.10 --
# `[sources]` is a 1.11 feature, and a 1.10 Pkg would ignore it and then
# fail to find TreeHydro at all, so the floor is stated below rather than
# left to be discovered.
#
# `KernelAbstractions` is here because `bin/backend.jl` needs it, and that
# file must work in this environment as well as the package one.

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
SixelTerm = "65edfddc-f399-4499-8369-a1bd38eee2ea"
TreeAMR = "91bc416d-811c-44c1-9bc4-b9c8bbdbbd08"
TreeHydro = "18f621c7-d3c4-4697-8f68-54143cdddff7"

[compat]
TreeAMR = "0.1.1"
julia = "1.11"

[sources]
TreeHydro = {path = ".."}
