# The tertiary-spiral zoom (`production_strain_c.toml`, job 566253) with a
# calmer camera: past `target_time` it moves with the mean gas velocity over
# the middle of the view (`track = "view"`) instead of riding one tracer,
# which orbited inside the merging vortices and swung the camera round; and a
# 2 s hold at ×256 instead of 5 s, which cost 5.7 h. Restarted from that run's
# `level10_f001244.h5` (×64, t = 3.35), into
# /mnt/beegfs/eschnetter/claude/treehydro-showcase-tertiary-view.
#
# The strain-matched zoom re-aimed at a tertiary spiral: stage B
# (`production_strain_b.toml`) restarted from its `level8_f000944.h5` (×16,
# t = 2.999), the camera gliding onto the multi-turn spiral beside the billow
# that the ×32 cut (`production_strain_cut.toml`, job 566206) showed in its
# zoom-out frame 1300 at t = 3.385, pixel (205, 690). That spiral formed under
# that run's mesh, which differs from this one's near the new camera, so it
# is aimed at rather than guaranteed. Output in
# /mnt/beegfs/eschnetter/claude/treehydro-showcase-tertiary.
#
# Stage B of `production_strain.toml` (read its header): the same run,
# restarted from stage A's checkpoint `level5_f000494.h5` (×2, t = 2.475)
# with the camera aimed at the secondary billow picked in stage A's frame 640
# (t = 2.644, ×3.9), the orange spiral at pixel (1055, 245) — Symmetry job
# 566175, /mnt/beegfs/eschnetter/claude/treehydro-showcase-strainprod. Only
# the camera differs from stage A, which a restart allows.
#
# Option 1 aimed at secondary structure: the strain-matched zoom
# (`pilot_strain.toml`) at production resolution — 512 to 1024 cells across a
# 1080p view — into a secondary billow rather than the braid, whose stagnation
# point turned out to hold one straight contact. Secondary billows exist only
# at this resolution, so the target is picked from this run's own frames, in
# two stages:
#
#   A. The intro runs to t = 2.1, when they are forming, and the zoom to ×4.
#      Below ×4 every level's window covers the whole box, so the flow there
#      does not depend on the camera, and the stage-A camera (a braid point) is
#      only a placeholder. Stop there (`--stop-after`).
#   B. Pick a billow in a stage-A frame at zoom 2–4, set `target` and
#      `target_time` to it, and restart from stage A's level-5 checkpoint
#      (×2): the camera glides onto the target by `target_time` and follows
#      the gas from there, to ×256, refinement level 12.

